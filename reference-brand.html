<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand &mdash; Web RAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/rab.css">
<script>(function(){try{var t=localStorage.getItem('rab_theme')||'light';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
</head>
<body data-page="reference-brand" data-title="Brand">

<div class="app">
  <div class="side-backdrop" id="side-backdrop"></div>
  <aside class="side" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content"><div id="zone"></div></main>
  </div>
</div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/rab-data.js"></script>
<script src="assets/js/rab-core.js"></script>
<script src="assets/js/rab-info.js"></script>
<script src="assets/js/rab-layout.js"></script>
<script>
'use strict';

renderTable('#zone', {
  key:'reference-brand', perm:'reference', entity:'Brand', idKey:'kode',
  title:'Brand', desc:'Merek material yang dipakai pada segmen keempat kode material.',
  rows:()=>DB.BRAND,
  toolbar:[TB.add('Brand'), TB.upload('reference-brand'), TB.download()],
  columns:[
    {key:'kode', label:'Code', width:'96px', render:r=>`<span class="cell-main mono">${esc(r.kode)}</span>`},
    {key:'nama', label:'Brand Name', render:r=>`<div class="cell-main">${esc(r.nama)}</div>`},
    {key:'jml_mat', label:'Jumlah Material', width:'150px', align:'right', filter:false, render:r=>`<span class="num">${nf(r.jml_mat)}</span>`},
    {key:'status', label:'Status', width:'120px', filter:'select', options:['Aktif','Nonaktif'], render:r=>statusBadge(r.status)}
  ],
  form:[
    {key:'kode', label:'Kode Brand', required:true, help:'2-3 huruf kapital, contoh HF untuk Hafele.'},
    {key:'nama', label:'Nama Brand', required:true, full:true},
    {key:'status', label:'Status', type:'switch'}
  ],
  formDefaults:()=>({status:'Aktif', jml_mat:0}),
  actions:['view','edit','delete'],
  detail:r=>detailHTML([['Kode',r.kode],['Nama Brand',r.nama],['Jumlah Material',nf(r.jml_mat)],['Status',statusBadge(r.status)]])
});

</script>
</body>
</html>
