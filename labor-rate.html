<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labor Rate &mdash; Web RAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/rab.css">
<script>(function(){try{var t=localStorage.getItem('rab_theme')||'light';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
</head>
<body data-page="labor-rate" data-title="Labor Rate">

<div class="app">
  <div class="side-backdrop" id="side-backdrop"></div>
  <aside class="side" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content"><div id="zone"></div></main>
  </div>
</div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/rab-data.js"></script>
<script src="assets/js/rab-core.js"></script>
<script src="assets/js/rab-layout.js"></script>
<script>
'use strict';

const cfg = {
  key:'labor', perm:'labor-rate', entity:'Labor Rate', idKey:'kode',
  title:'Labor Rate', desc:'Tarif upah harian dan borongan. Badge biru = Harian, hijau = Borongan.',
  rows:()=>DB.LABOR,
  toolbar:[TB.add('Labor Rate'), TB.upload('labor'), TB.download()],
  columns:[
    {key:'kode', label:'Kode', width:'100px', render:r=>`<span class="cell-main mono">${esc(r.kode)}</span>`},
    {key:'nama', label:'Nama Jenis Upah', render:r=>`<div class="cell-main">${esc(r.nama)}</div>`},
    {key:'jenis',label:'Jenis Perhitungan', width:'170px', filter:'select', options:['Harian','Borongan'], render:r=>statusBadge(r.jenis)},
    {key:'sat',  label:'Satuan', width:'96px', filter:'select', options:['oh','m2']},
    {key:'tarif',label:'Tarif Berlaku', width:'150px', align:'right', filter:false, render:r=>money(r.tarif)},
    {key:'status',label:'Status', width:'118px', filter:'select', options:['Aktif','Nonaktif'], render:r=>statusBadge(r.status)}
  ],
  actions:['view','edit','history','delete'],
  form:(d)=>[
    {key:'kode', label:'Kode Upah', required:true, help:'Format UP.nn.'},
    {key:'jenis',label:'Jenis Perhitungan', type:'select', required:true, options:['Harian','Borongan']},
    {key:'nama', label:'Nama Jenis Upah', required:true, full:true},
    {key:'sat',  label:'Satuan', type:'select', required:true, options: d.jenis==='Borongan' ? ['m2','m1','unit'] : ['oh'],
     help:'Harian hanya menawarkan orang-hari, Borongan menawarkan satuan pekerjaan.'},
    {key:'tarif',label:'Tarif Awal (Rp)', type:'number', required:true},
    {key:'mulai',label:'Berlaku Sejak', type:'date', required:true},
    {key:'status',label:'Status', type:'select', options:['Aktif','Nonaktif']}
  ],
  formDefaults:()=>({status:'Aktif', jenis:'Harian', sat:'oh', mulai:today(), kode:'UP.'+String(DB.LABOR.length+1).padStart(2,'0')}),
  onFormShown:(el)=>{
    const j = $('[name="jenis"]',el), s = $('[name="sat"]',el);
    j.onchange = () => {
      const opts = j.value==='Borongan' ? ['m2','m1','unit'] : ['oh'];
      s.innerHTML = opts.map(o=>`<option>${o}</option>`).join('');
    };
  },
  detail:r=>detailHTML([['Kode',r.kode],['Nama',r.nama],['Jenis Perhitungan',statusBadge(r.jenis)],
    ['Satuan',r.sat],['Tarif Berlaku',money(r.tarif)],['Status',statusBadge(r.status)]])
};
renderTable('#zone', cfg);

</script>
</body>
</html>
