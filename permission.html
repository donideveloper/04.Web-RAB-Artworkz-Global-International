<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permission Menu &mdash; Web RAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/rab.css">
<script>(function(){try{var t=localStorage.getItem('rab_theme');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
</head>
<body data-page="permission" data-title="Permission Menu">

<div class="app">
  <div class="side-backdrop" id="side-backdrop"></div>
  <aside class="side" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content"><div id="zone"></div></main>
  </div>
</div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/rab-data.js"></script>
<script src="assets/js/rab-core.js"></script>
<script src="assets/js/rab-layout.js"></script>
<script>
'use strict';

renderTable('#zone', {
  key:'permission', perm:'permission', entity:'Permission', idKey:'kode', formSize:'lg',
  title:'Menu Permissions', desc:'Unit hak akses terkecil. Daftar tombol fitur berbeda-beda sesuai kebutuhan menu.',
  rows:()=>DB.PERMISSIONS,
  toolbar:[TB.add('Permission'), TB.upload('permission'), TB.download()],
  columns:[
    {key:'kode', label:'Kode', width:'108px', render:r=>`<span class="cell-main mono">${esc(r.kode)}</span>`},
    {key:'menu', label:'Nama Menu', width:'210px', render:r=>`<div class="cell-main">${esc(r.menu)}</div>`},
    {key:'modul',label:'Modul Induk', width:'150px', filter:'select', options:()=>[...new Set(DB.PERMISSIONS.map(p=>p.modul))]},
    {key:'url',  label:'URL', width:'190px', render:r=>`<code>${esc(r.url)}</code>`},
    {key:'fitur',label:'Daftar Fitur', filterValue:r=>r.fitur.join(' '), sortValue:r=>r.fitur.length,
     render:r=>chips(r.fitur,'blue'), exportValue:r=>r.fitur.join(', ')},
    {key:'status',label:'Status', width:'112px', filter:'select', options:['Aktif','Nonaktif'], render:r=>statusBadge(r.status)}
  ],
  actions:['view','edit','delete'],
  form:[
    {key:'kode', label:'Kode Permission', required:true},
    {key:'modul',label:'Modul Induk', type:'select', required:true, options:['Main','Master Data','Price Analysis','Project','User Access','System']},
    {key:'menu', label:'Nama Menu', required:true, full:true, ph:'contoh: Material & Price'},
    {key:'url',  label:'URL / Route', required:true, full:true, ph:'contoh: /master/material'},
    {key:'fitur',label:'Tombol fitur di dalam menu ini', type:'checks', required:true, full:true, options:['View','Add','Edit','Delete','Import','Export','Print','Approve','Finalize','Discount','Set Permission','Reset Password','Unlock','History']},
    {key:'status',label:'Status', type:'select', options:['Aktif','Nonaktif']}
  ],
  formDefaults:()=>({kode:nextCode('PRM-', DB.PERMISSIONS, 'kode'), fitur:['View'], status:'Aktif'}),
  detail:r=>detailHTML([['Kode',r.kode],['Nama Menu',r.menu],['Modul',r.modul],['URL',`<code>${esc(r.url)}</code>`],
    ['Daftar Fitur',chips(r.fitur,'blue')],['Status',statusBadge(r.status)]])
});

</script>
</body>
</html>
