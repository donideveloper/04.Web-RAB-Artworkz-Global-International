<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Trail & Activity Log &mdash; Web RAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/rab.css">
<script>(function(){try{var t=localStorage.getItem('rab_theme')||'light';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
</head>
<body data-page="audit" data-title="Audit Trail & Activity Log">

<div class="app">
  <div class="side-backdrop" id="side-backdrop"></div>
  <aside class="side" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content"><div id="zone"><div id="zone-tbl"></div></div></main>
  </div>
</div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/rab-data.js"></script>
<script src="assets/js/rab-core.js"></script>
<script src="assets/js/rab-layout.js"></script>
<script>
'use strict';

$('#zone').insertAdjacentHTML('afterbegin', roleNote('Log tidak dapat diubah maupun dihapus oleh role mana pun, termasuk Administrator. Kolom <b>Kelompok</b> membedakan log operasional (boleh dihapus setelah masa simpan) dari arsip legal.'));
renderTable('#zone-tbl', {
  key:'audit', perm:'audit', entity:'Log', idKey:'waktu',
  title:'Audit Trail & Activity Log', desc:'Penelusuran riwayat perubahan seluruh modul.',
  rows:()=>DB.AUDIT,
  toolbar:[TB.download()],
  columns:[
    {key:'waktu', label:'Waktu', width:'160px', render:r=>`<span class="num">${esc(r.waktu)}</span>`},
    {key:'user',  label:'Pengguna', width:'150px', render:r=>`<code>${esc(r.user)}</code>`},
    {key:'modul', label:'Modul', width:'180px', filter:'select', options:()=>[...new Set(DB.AUDIT.map(a=>a.modul))]},
    {key:'aksi',  label:'Aksi', width:'110px', filter:'select', options:['Insert','Update','Delete','Approve','Import','Print'],
     render:r=>`<span class="bdg ${({Insert:'ok',Update:'blue',Delete:'danger',Approve:'info',Import:'warn',Print:'off'})[r.aksi]||'off'}">${esc(r.aksi)}</span>`},
    {key:'data',  label:'Data', width:'160px', render:r=>`<span class="mono">${esc(r.data)}</span>`},
    {key:'grp',   label:'Kelompok', width:'130px', filter:'select', options:['Operasional','Legal']},
    {key:'ket',   label:'Ringkasan Perubahan'}
  ],
  actions:['view'],
  detail:r=>`<div class="row g-3">
    <div class="col-6"><div class="card mb-0"><div class="card-tb" style="padding:12px 16px"><div><h2 style="font-size:13px">Nilai Sebelum</h2></div></div>
      <div class="card-body"><dl class="dl-detail"><dt>HARGA</dt><dd class="text-ink3">410.000</dd><dt>UPDATE_DATE</dt><dd class="text-ink3">10/06/2026</dd><dt>STATUS</dt><dd class="text-ink3">Aktif</dd></dl></div></div></div>
    <div class="col-6"><div class="card mb-0" style="border-color:var(--warn)"><div class="card-tb" style="padding:12px 16px"><div><h2 style="font-size:13px">Nilai Sesudah</h2></div></div>
      <div class="card-body"><dl class="dl-detail"><dt>HARGA</dt><dd style="background:var(--warn-soft);color:var(--warn);border-radius:5px;padding:2px 7px;display:inline-block">425.000</dd><dt>UPDATE_DATE</dt><dd style="background:var(--warn-soft);color:var(--warn);border-radius:5px;padding:2px 7px;display:inline-block">18/09/2026</dd><dt>STATUS</dt><dd class="text-ink3">Aktif</dd></dl></div></div></div>
    <div class="col-12"><div class="alert-box info">${icon('info',16)}<div>Dicatat oleh <b>${esc(r.user)}</b> pada ${esc(r.waktu)} dari modul ${esc(r.modul)}. Kolom yang berubah diberi latar kuning.</div></div></div>
  </div>`
});

</script>
</body>
</html>
