<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client &mdash; Web RAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/rab.css">
<script>(function(){try{var t=localStorage.getItem('rab_theme');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
</head>
<body data-page="reference-client" data-title="Client">

<div class="app">
  <div class="side-backdrop" id="side-backdrop"></div>
  <aside class="side" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content"><div id="zone"></div></main>
  </div>
</div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/rab-data.js"></script>
<script src="assets/js/rab-core.js"></script>
<script src="assets/js/rab-layout.js"></script>
<script>
'use strict';

renderTable('#zone', {
  key:'reference-client', perm:'reference', entity:'Client', idKey:'kode', formSize:'lg',
  title:'Client', desc:'Data pemberi kerja yang tercetak pada dokumen penawaran.',
  rows:()=>DB.CLIENT,
  toolbar:[TB.add('Client'), TB.upload('reference-client'), TB.download()],
  columns:[
    {key:'kode', label:'Code', width:'110px', render:r=>`<span class="cell-main mono">${esc(r.kode)}</span>`},
    {key:'nama', label:'Nama Perusahaan', render:r=>`<div class="cell-main">${esc(r.nama)}</div>`},
    {key:'jenis', label:'Jenis Bangunan', width:'150px', filter:'select', options:()=>DB.BUILDING.map(b=>b.nama)},
    {key:'kota', label:'Kota', width:'130px'},
    {key:'pic', label:'Penanggung Jawab', width:'170px'},
    {key:'status', label:'Status', width:'118px', filter:'select', options:['Aktif','Nonaktif'], render:r=>statusBadge(r.status)}
  ],
  form:[
    {key:'kode', label:'Kode Client', required:true},
    {key:'nama', label:'Nama Perusahaan', required:true},
    {key:'alamat', label:'Alamat', type:'textarea', full:true},
    {key:'jenis', label:'Jenis Bangunan', type:'select', required:true, options:()=>DB.BUILDING.map(b=>b.nama)},
    {key:'kota', label:'Kota', required:true},
    {key:'pic', label:'Penanggung Jawab', required:true},
    {key:'telp', label:'Telepon / Email'},
    {key:'npwp', label:'NPWP', full:true, help:'Dicetak pada dokumen penawaran bila diisi.'},
    {key:'status', label:'Status', type:'select', options:['Aktif','Nonaktif']}
  ],
  formDefaults:()=>({status:'Aktif', kode:nextCode('CLT-', DB.CLIENT, 'kode')}),
  actions:['view','edit','delete'],
  detail:r=>detailHTML([['Kode',r.kode],['Nama Perusahaan',r.nama],['Alamat',r.alamat||'-'],['Jenis Bangunan',r.jenis],['Kota',r.kota],['Penanggung Jawab',r.pic],['NPWP',r.npwp||'-'],['Status',statusBadge(r.status)]])
});

</script>
</body>
</html>
