<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit Price List &mdash; Web RAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/rab.css">
<script>(function(){try{var t=localStorage.getItem('rab_theme')||'light';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
</head>
<body data-page="unit-price-list" data-title="Unit Price List">

<div class="app">
  <div class="side-backdrop" id="side-backdrop"></div>
  <aside class="side" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content"><div id="zone"></div></main>
  </div>
</div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/rab-data.js"></script>
<script src="assets/js/rab-core.js"></script>
<script src="assets/js/rab-info.js"></script>
<script src="assets/js/rab-layout.js"></script>
<script>
'use strict';

renderTable('#zone', {
  key:'upl', perm:'unit-price-list', entity:'Harga Satuan Pekerjaan', idKey:'kode',
  title:'Unit Price List', desc:'Daftar harga satuan pekerjaan yang dipakai estimator setiap hari (hanya View dan Export).',
  rows:()=>DB.AHS.filter(a=>a.status==='Disetujui'),
  toolbar:[TB.download()],
  columns:[
    {key:'kode', label:'Kode', width:'120px', render:r=>`<span class="cell-main mono">${esc(r.kode)}</span>`},
    {key:'nama', label:'Uraian Pekerjaan', render:r=>`<div class="cell-main">${esc(r.nama)}</div>`},
    {key:'grp',  label:'Kelompok', width:'190px', filter:'select', options:()=>DB.WORKGROUP.map(w=>w.kode),
     render:r=>(DB.WORKGROUP.find(w=>w.kode===r.grp)||{}).nama||r.grp},
    {key:'sat',  label:'Satuan', width:'96px', filter:'select', options:['Unit','M2','M1']},
    {key:'hsp',  label:'Harga Satuan', width:'170px', align:'right', filter:false, render:r=>money(r.hsp)}
  ],
  /* rev-6 poin 8: selain jendela Detail, disediakan aksi Buka Halaman Detail
     menuju rincian AHS (hanya-baca untuk role yang tidak berhak menyunting). */
  /* rev-6 poin 18 (P-54): aksi Edit DIHAPUS dari menu ini. Unit Price List
     adalah daftar rujukan harian yang bersifat hanya-baca (PRM-007 hanya
     memiliki fitur View dan Export); penyuntingan AHS dilakukan di menu
     Unit Price Analysis. Tombol buka-halaman tetap tersedia bagi yang perlu
     melihat atau mengubah rinciannya. */
  actions:[{k:'open'},'view'],
  onAction:(k,r)=>{
    if (k==='open'){ location.href='unit-price-analysis-detail.html?kode='+r.kode+'&from=upl'; return true; }
    return false;
  },
  /* rev-6 poin 8: jendela Detail sebelumnya hanya memuat tujuh baris keterangan
     sehingga tidak menjawab pertanyaan utama estimator — "harga ini tersusun
     dari apa". Kini memakai ahsDetailHTML(): komposisi biaya A/B/C, margin,
     harga pokok, daftar komponen upah dan bahan beserta koefisiennya,
     breakdown rujukan, serta pemakaiannya pada BOQ. */
  detailSub:r=>r.kode+' — '+r.nama+' · per 1 '+r.sat,
  detailSize:'xl',
  detail:r=>ahsDetailHTML(r),
  detailFooter:r=>[
    {label:'Buka Rincian AHS', cls:'btn-primary', ic:'openpage',
     onClick:()=>location.href='unit-price-analysis-detail.html?kode='+r.kode+'&from=upl'}
  ]
});

</script>
</body>
</html>
