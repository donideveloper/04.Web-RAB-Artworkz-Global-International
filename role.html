<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Role &mdash; Web RAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/rab.css">
<script>(function(){try{var t=localStorage.getItem('rab_theme')||'light';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
</head>
<body data-page="role" data-title="Role">

<div class="app">
  <div class="side-backdrop" id="side-backdrop"></div>
  <aside class="side" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content"><div id="zone"></div></main>
  </div>
</div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/rab-data.js"></script>
<script src="assets/js/rab-core.js"></script>
<script src="assets/js/rab-layout.js"></script>
<script>
'use strict';

renderTable('#zone', {
  key:'role', perm:'role', entity:'Role', idKey:'kode',
  title:'Role', desc:'Pemetaan role ke permission dilakukan dari tombol Set Permission pada kolom Actions.',
  rows:()=>DB.ROLES,
  toolbar:[TB.add('Role'), TB.download()],
  columns:[
    {key:'kode', label:'Kode', width:'92px', render:r=>`<span class="cell-main mono">${esc(r.kode)}</span>`},
    {key:'nama', label:'Nama Role', width:'210px', render:r=>`<div class="cell-main">${esc(r.nama)}</div>`},
    {key:'desc', label:'Deskripsi'},
    {key:'jml_p',label:'Jml Permission', width:'140px', align:'right', filter:false,
     sortValue:r=>Object.keys(DB.ROLE_PERM[r.kode]||{}).length,
     render:r=>`<span class="num">${(DB.ROLE_PERM[r.kode]||{})['*'] ? DB.PERMISSIONS.length : Object.keys(DB.ROLE_PERM[r.kode]||{}).length}</span>`},
    {key:'jml_u',label:'Jml Pengguna', width:'130px', align:'right', filter:false,
     sortValue:r=>DB.USERS.filter(u=>u.roles.includes(r.kode)).length,
     render:r=>`<span class="num">${DB.USERS.filter(u=>u.roles.includes(r.kode)).length}</span>`},
    {key:'status',label:'Status', width:'112px', filter:'select', options:['Aktif','Nonaktif'], render:r=>statusBadge(r.status)}
  ],
  actions:[{k:'perm'},'view','edit','delete'],
  onAction:(k,r)=>{ if(k==='perm'){ location.href='role-permission.html?role='+r.kode; return true; } return false; },
  form:[
    {key:'kode', label:'Kode Role', required:true, help:'3 huruf kapital, contoh EST.'},
    {key:'nama', label:'Nama Role', required:true},
    {key:'desc', label:'Deskripsi', type:'textarea', full:true},
    {key:'status',label:'Status', type:'select', options:['Aktif','Nonaktif']}
  ],
  formDefaults:()=>({status:'Aktif'}),
  detail:r=>detailHTML([['Kode',r.kode],['Nama Role',r.nama],['Deskripsi',r.desc],
    ['Jumlah Pengguna',DB.USERS.filter(u=>u.roles.includes(r.kode)).length],['Status',statusBadge(r.status)]])
});

</script>
</body>
</html>
