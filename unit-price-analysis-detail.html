<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AHS — Penyusunan &mdash; Web RAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/rab.css">
<script>(function(){try{var t=localStorage.getItem('rab_theme')||'light';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
</head>
<body data-page="unit-price-analysis" data-title="AHS — Penyusunan" data-altperm="unit-price-list">

<div class="app">
  <div class="side-backdrop" id="side-backdrop"></div>
  <aside class="side" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content"><div id="zone">
<div id="head"></div>
<div class="row g-3">
  <div class="col-12 col-xl-8"><div id="blocks"></div></div>
  <div class="col-12 col-xl-4"><div class="side-panel" id="calc"></div></div>
</div></div></main>
  </div>
</div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/rab-data.js"></script>
<script src="assets/js/rab-core.js"></script>
<script src="assets/js/rab-info.js"></script>
<script src="assets/js/rab-layout.js"></script>
<script>
'use strict';

const KODE = new URLSearchParams(location.search).get('kode') || 'WD.2';
const ahs = DB.AHS.find(a=>a.kode===KODE) || DB.AHS[2];
const FROM = new URLSearchParams(location.search).get('from') || '';

/* rev-6 poin 8 — rincian contoh yang konsisten.
   Bila satu AHS belum memiliki rincian komponen, prototipe menyalin susunan
   AHS WD.2 sebagai contoh. Sebelumnya salinan itu dipakai apa adanya sehingga
   hasil F-nya tidak sama dengan kolom Harga Satuan pada tabel. Kini seluruh
   koefisien dan biaya tetap diskalakan supaya D x (1 + Margin) tepat sama
   dengan Harga Satuan yang terdaftar, sehingga angka pada tabel, jendela
   Detail, dan halaman ini selalu cocok. */
if (!DB.AHS_D[ahs.kode]){
  const c = JSON.parse(JSON.stringify(DB.AHS_D['WD.2']));
  const sA = c.A.reduce((s,x)=>s+x.koef*x.harga,0);
  const sB = c.B.reduce((s,x)=>s+x.koef*x.harga,0);
  const sC = c.C.reduce((s,x)=>s+(x.jenis==='Persentase'?(sA+sB)*x.nilai:x.nilai),0);
  const target = (Number(ahs.hsp)||0)/(1+(Number(ahs.margin)||0));
  const rasio  = (sA+sB+sC) > 0 ? target/(sA+sB+sC) : 1;
  const bulat  = n => Math.round(n*10000)/10000;
  c.A.forEach(x=>x.koef = bulat(x.koef*rasio));
  c.B.forEach(x=>x.koef = bulat(x.koef*rasio));
  c.C.forEach(x=>{ if (x.jenis!=='Persentase') x.nilai = Math.round(x.nilai*rasio); });
  c.contoh = true;
  DB.AHS_D[ahs.kode] = c;
}
const d = DB.AHS_D[ahs.kode];
const canMargin = can('unit-price-analysis','approve');
const RO = !can('unit-price-analysis','edit');

const sumA = () => d.A.reduce((s,x)=>s+x.koef*x.harga, 0);
const sumB = () => d.B.reduce((s,x)=>s+x.koef*x.harga, 0);
const sumC = () => d.C.reduce((s,x)=>s + (x.jenis==='Persentase' ? (sumA()+sumB())*x.nilai : x.nilai), 0);
const D = () => sumA()+sumB()+sumC();
const E = () => D()*ahs.margin;
const F = () => D()+E();

$('#head').innerHTML = `
<div class="card"><div class="card-tb">
  <div>
    <a href="${FROM==='upl'?'unit-price-list.html':'unit-price-analysis.html'}" class="btn btn-ghost btn-sm mb-2">${icon('back',14)} ${FROM==='upl'?'Back to Unit Price List':'Back to list'}</a>
    <h2>${esc(ahs.kode)} &middot; ${esc(ahs.nama)}</h2>
    <p>Kelompok ${esc((DB.WORKGROUP.find(w=>w.kode===ahs.grp)||{}).nama||'-')} &middot; Satuan ${esc(ahs.sat)} &middot;
       Breakdown rujukan ${esc(ahs.bd||'-')} &middot; Margin ${pct(ahs.margin)} &middot; ${statusBadge(ahs.status)}</p>
  </div>
  <div class="acts">
    <button class="btn btn-ghost" id="btn-sim" title="Membandingkan harga komponen tersimpan dengan harga terkini pada Bahan dan Upah">${icon('trend',15)} Price Simulation</button>
    ${RO?'':`<button class="btn btn-ghost" id="btn-load" title="Mengisi blok B (Bahan) dari rekapitulasi Material Breakdown rujukan">${icon('download',15)} Load from Breakdown</button>
    <button class="btn btn-primary" id="btn-save">${icon('save',15)} Save AHS</button>`}
  </div>
</div></div>
${d.contoh?`<div class="alert-box info">${icon('info',16)}<div>Rincian komponen A, B, dan C pada layar ini adalah <b>contoh</b>: susunannya disalin dari AHS WD.2 lalu koefisiennya diskalakan agar Harga Satuan (F) tepat sama dengan ${rp(ahs.hsp)} pada daftar. Ganti isinya dengan komponen yang sebenarnya.</div></div>`:''}
${ahs.review?`<div class="alert-box warn">${icon('alert',16)}<div>AHS ini perlu ditinjau ulang: harga salah satu komponen penyusunnya telah berubah sejak terakhir disimpan.</div></div>`:''}
${canMargin?'':roleNote('Role <b>'+curRole()+'</b>: margin terkunci. Hanya role SPV ke atas yang dapat mengubah persentase margin.')}`;

function blockTable(title, key, rows, note){
  return `<div class="card">
    <div class="card-tb" style="padding:14px 20px">
      <div><h2 style="font-size:14px">${title}</h2>${note?`<p>${note}</p>`:''}</div>
      ${RO?'':`<div class="acts"><button class="btn btn-ghost btn-sm" data-add="${key}">${icon('plus',14)} Add Row</button></div>`}
    </div>
    <div class="tbl-wrap"><table class="dt"><thead><tr>
      <th style="width:120px">Kode</th><th>Uraian</th><th style="width:78px">Sat.</th>
      <th class="right" style="width:104px">Koefisien</th><th class="right" style="width:140px">Harga Satuan</th>
      <th class="right" style="width:150px">Jumlah Harga</th>${RO?'':'<th style="width:48px"></th>'}
    </tr></thead><tbody>
      ${rows.map((r,i)=>`<tr>
        <td><span class="mono" style="font-size:11px">${esc(r.kode)}</span></td>
        <td>${key==='B'&&DB.AHS.some(a=>a.kode===r.kode)?icon('calc',13)+' ':''}${esc(r.nama)}</td>
        <td>${esc(r.sat)}</td>
        <td class="right">${RO?nf(r.koef):`<span class="editable num" contenteditable data-b="${key}" data-i="${i}" data-k="koef">${r.koef}</span>`}</td>
        <td class="right num">${rp(r.harga)}</td>
        <td class="right num cell-main">${rp(r.koef*r.harga)}</td>
        ${RO?'':`<td><button class="icon-btn danger" data-del="${key}:${i}">${icon('trash',15)}</button></td>`}
      </tr>`).join('')}
      <tr class="sub-total"><td colspan="${RO?5:5}">Jumlah ${title.split('—')[1]||title}</td>
        <td class="right num">${rp(rows===d.A?sumA():sumB())}</td>${RO?'':'<td></td>'}</tr>
    </tbody></table></div></div>`;
}

function draw(){
  $('#blocks').innerHTML =
    blockTable('A &mdash; Upah Tenaga Kerja', 'A', d.A) +
    blockTable('B &mdash; Bahan', 'B', d.B, 'Baris dapat berupa material maupun AHS lain (ditandai ikon).') +
    `<div class="card">
      <div class="card-tb" style="padding:14px 20px"><div><h2 style="font-size:14px">C &mdash; Biaya Lain</h2>
        <p>Pengisian berupa nilai tetap atau persentase terhadap A + B.</p></div>
        ${RO?'':`<div class="acts"><button class="btn btn-ghost btn-sm" data-add="C">${icon('plus',14)} Add Row</button></div>`}</div>
      <div class="tbl-wrap"><table class="dt"><thead><tr>
        <th style="width:120px">Kode</th><th>Uraian</th><th style="width:150px">Jenis</th>
        <th class="right" style="width:140px">Nilai</th><th class="right" style="width:150px">Jumlah Harga</th>${RO?'':'<th style="width:48px"></th>'}
      </tr></thead><tbody>
        ${d.C.map((r,i)=>`<tr>
          <td><span class="mono" style="font-size:11px">${esc(r.kode)}</span></td><td>${esc(r.nama)}</td>
          <td><span class="bdg ${r.jenis==='Persentase'?'blue':'off'}">${esc(r.jenis)}</span></td>
          <td class="right num">${r.jenis==='Persentase'?(r.nilai*100).toFixed(2)+'%':rp(r.nilai)}</td>
          <td class="right num cell-main">${rp(r.jenis==='Persentase'?(sumA()+sumB())*r.nilai:r.nilai)}</td>
          ${RO?'':`<td><button class="icon-btn danger" data-del="C:${i}">${icon('trash',15)}</button></td>`}
        </tr>`).join('')}
        <tr class="sub-total"><td colspan="4">Jumlah Biaya Lain</td><td class="right num">${rp(sumC())}</td>${RO?'':'<td></td>'}</tr>
      </tbody></table></div></div>`;

  $$('[contenteditable]').forEach(el=>{
    el.onblur = () => { d[el.dataset.b][+el.dataset.i].koef = parseFloat(el.textContent.replace(',','.'))||0; draw(); drawCalc(); saveDB(); };
    el.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); el.blur(); } };
  });
  $$('[data-del]').forEach(b=>b.onclick=()=>{
    const [k,i] = b.dataset.del.split(':'); d[k].splice(+i,1); draw(); drawCalc(); saveDB(); toast('Baris berhasil dihapus.');
  });
  $$('[data-add]').forEach(b=>b.onclick=()=>addRow(b.dataset.add));
}

function addRow(k){
  const isC = k==='C';
  const opts = k==='A' ? DB.LABOR.map(l=>({v:l.kode,l:l.kode+' — '+l.nama+' ('+rp(l.tarif)+')'}))
    : DB.MATERIAL.map(m=>({v:m.kode,l:m.kode+' — '+m.nama})).concat(DB.AHS.filter(a=>a.kode!==ahs.kode).map(a=>({v:a.kode,l:'[AHS] '+a.kode+' — '+a.nama})));
  openModal({
    title:'Add Row — Blok '+k, size:'lg',
    body: isC
      ? formHTML([{key:'kode',label:'Kode',required:true},{key:'nama',label:'Uraian',required:true},
          {key:'jenis',label:'Jenis Pengisian',type:'select',options:['Nilai Tetap','Persentase'],required:true},
          {key:'nilai',label:'Nilai',type:'number',required:true,help:'Persentase ditulis dalam angka persen, contoh 2 untuk 2%.'}], {jenis:'Nilai Tetap'})
      : formHTML([{key:'kode',label:k==='A'?'Jenis Upah':'Material / AHS',type:'select',options:opts,required:true,full:true},
          {key:'koef',label:'Koefisien',type:'number',step:'0.0001',required:true}], {koef:1}),
    footer:[{label:'Cancel'},{label:'Save', cls:'btn-primary', ic:'save', onClick:(c,el)=>{
      if (isC){
        const o = readForm(el,[{key:'kode'},{key:'nama'},{key:'jenis'},{key:'nilai',type:'number'}]);
        o.nilai = o.jenis==='Persentase' ? o.nilai/100 : o.nilai;
        d.C.push(o);
      } else {
        const o = readForm(el,[{key:'kode'},{key:'koef',type:'number'}]);
        const src = k==='A' ? DB.LABOR.find(x=>x.kode===o.kode)
          : (DB.MATERIAL.find(x=>x.kode===o.kode) || DB.AHS.find(x=>x.kode===o.kode));
        d[k].push({kode:o.kode, nama:src.nama, sat:src.sat, koef:o.koef, harga:src.harga||src.tarif||src.hsp||0});
      }
      saveDB(); draw(); drawCalc(); c(); toast('Baris berhasil ditambahkan.');
    }}]
  });
}

function drawCalc(){
  const a=sumA(), b=sumB(), c=sumC(), tot=F();
  const bar = [[a,'var(--primary)','Upah'],[b,'var(--ok)','Bahan'],[c,'var(--warn)','Biaya lain'],[E(),'var(--info)','Margin']];
  $('#calc').innerHTML = `
  <div class="card">
    <div class="card-tb"><div><h2>Perhitungan</h2><p>Harga satuan pekerjaan per ${esc(ahs.sat)}.</p></div></div>
    <div class="card-body">
      <div class="kv"><span>A &mdash; Jumlah Upah</span><b class="num">${rp(a)}</b></div>
      <div class="kv"><span>B &mdash; Jumlah Bahan</span><b class="num">${rp(b)}</b></div>
      <div class="kv"><span>C &mdash; Biaya Lain</span><b class="num">${rp(c)}</b></div>
      <div class="kv"><span><b>D &mdash; Jumlah A + B + C</b></span><b class="num">${rp(a+b+c)}</b></div>
      <div class="kv"><span>E &mdash; Margin
        ${canMargin?`<input type="number" id="mg" value="${(ahs.margin*100).toFixed(0)}" style="width:64px" class="form-control d-inline-block ms-1 py-0"> %`
        :`<span class="bdg off ms-1">${pct(ahs.margin)} terkunci</span>`}</span><b class="num">${rp(E())}</b></div>
      <div class="kv total"><span>F &mdash; Harga Satuan Pekerjaan</span><b class="num">${rp(tot)}</b></div>
      <div class="mt-3">
        <div class="bar">${bar.map(x=>`<i style="width:${(x[0]/tot*100).toFixed(1)}%;background:${x[1]}"></i>`).join('')}</div>
        <div class="d-flex flex-wrap gap-2 mt-2">
          ${bar.map(x=>`<span class="text-ink2" style="font-size:11.5px">
            <span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${x[1]}"></span>
            ${x[2]} ${(x[0]/tot*100).toFixed(1)}%</span>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
  const mg = $('#mg');
  if (mg) mg.onchange = () => { ahs.margin = (Number(mg.value)||0)/100; drawCalc(); saveDB(); };
}
draw(); drawCalc();

$('#btn-sim').onclick = () => openModal({
  title:'Price Simulation', sub:'Perbandingan harga tersimpan dengan harga terkini per baris komponen.', size:'lg',
  body:`<div class="alert-box info mb-3">${icon('info',16)}<div>Membandingkan harga komponen yang <b>tersimpan pada AHS ini</b>
      dengan <b>harga terkini</b> pada menu Bahan dan Upah. Dipakai untuk melihat dampak kenaikan harga
      terhadap harga satuan pekerjaan sebelum diterapkan.</div></div>
    <div class="tbl-wrap"><table class="dt"><thead><tr><th>Komponen</th><th class="right">Harga Tersimpan</th>
    <th class="right">Harga Terkini</th><th class="right">Selisih</th></tr></thead><tbody>
    ${d.B.map(r=>{
      const m = DB.MATERIAL.find(x=>x.kode===r.kode);
      const now = m ? m.harga : r.harga, sel = (now-r.harga)*r.koef;
      return `<tr><td>${esc(r.nama)}</td><td class="right num">${rp(r.harga)}</td><td class="right num">${rp(now)}</td>
        <td class="right num" style="color:var(--${sel>=0?'danger':'ok'})">${sel>=0?'+':''}${nf(sel)}</td></tr>`;
    }).join('')}
  </tbody></table></div>
  <div class="alert-box info mt-3">${icon('info',16)}<div>Simulasi tidak mengubah data tersimpan. Gunakan tombol Save AHS untuk menerapkan harga terkini.</div></div>`,
  footer:[{label:'Close'}]
});
if ($('#btn-load')) $('#btn-load').onclick = () => {
  /* rev-4 — mengisi blok B (Bahan) dari rekapitulasi Material Breakdown.
     Sumber data: menu Price Analysis > Material Breakdown (tabel TB_T_BREAKDOWN_D).
     Koefisien = Volume + Waste tiap material pada breakdown rujukan. */
  openModal({
    title:'Load from Breakdown', sub:'Mengisi blok B — Bahan dari rekapitulasi Material Breakdown.', size:'md',
    body:`<div class="alert-box info">${icon('info',16)}<div>Blok B diisi dari rekapitulasi kebutuhan material pada menu
        <b>Material Breakdown</b>. Koefisien tiap material diambil dari kolom <b>Volume + Waste</b> breakdown,
        sehingga rincian ukuran tidak perlu diketik ulang di sini. Blok A (Upah) dan C (Biaya Lain) tidak berubah.</div></div>` +
      formHTML([
        {key:'bd', label:'Breakdown Rujukan', type:'select', required:true, full:true,
         options:()=>DB.BREAKDOWN.map(b=>({v:b.kode, l:b.kode+' — '+b.nama+' ('+b.finishing+') · '+b.status}))},
        {key:'mode', label:'Perlakuan Blok B', type:'select', full:true,
         options:['Ganti seluruh isi blok B','Tambahkan ke blok B yang ada']}
      ], {bd: ahs.bd || (DB.BREAKDOWN[0]||{}).kode}),
    footer:[{label:'Cancel'},{label:'Load', cls:'btn-primary', ic:'download', onClick:(c,el)=>{
      const o = readForm(el,[{key:'bd'},{key:'mode'}]);
      const hdr = DB.BREAKDOWN.find(b=>b.kode===o.bd);
      const src = DB.BREAKDOWN_D[o.bd];
      if (!hdr || !src || !src.length){ toast('Breakdown tersebut belum memiliki baris material.','err'); return; }
      if (hdr.status!=='Disetujui'){
        toast('Breakdown '+hdr.kode+' berstatus '+hdr.status+'. Hanya breakdown Disetujui yang boleh ditarik ke AHS.','warn');
        return;
      }
      const matOf = k => DB.MATERIAL.find(m=>m.kode===k) || {nama:k, harga:0, sat:'-'};
      const volOf = r => (r.p && r.l) ? r.p*r.l*r.jml : r.jml;
      const agg = {};
      src.forEach(r=>{ agg[r.mat] = (agg[r.mat]||0) + volOf(r)*(1+(r.waste||0)); });
      const isi = Object.entries(agg).map(([k,v])=>{
        const m = matOf(k);
        return {kode:k, nama:m.nama, sat:m.sat, koef:Number(v.toFixed(4)), harga:m.harga};
      });
      d.B = o.mode==='Tambahkan ke blok B yang ada' ? d.B.concat(isi) : isi;
      ahs.bd = o.bd;
      logAudit('Unit Price Analysis','Update',ahs.kode,'Blok B diisi dari breakdown '+o.bd+' ('+isi.length+' baris)');
      saveDB(); draw(); drawCalc(); c();
      toast(isi.length+' baris material dimuat dari breakdown '+o.bd+'. Tekan Save AHS untuk menyimpan harga satuan baru.');
    }}]
  });
};
if ($('#btn-save')) $('#btn-save').onclick = () => {
  ahs.hsp = Math.round(F()); ahs.review = false; saveDB();
  toast('AHS '+ahs.kode+' berhasil disimpan. Harga satuan '+rp(ahs.hsp)+'.');
};

</script>
</body>
</html>
