<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit Price Analysis (AHS) &mdash; Web RAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/rab.css">
<script>(function(){try{var t=localStorage.getItem('rab_theme')||'light';if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
</head>
<body data-page="unit-price-analysis" data-title="Unit Price Analysis (AHS)">

<div class="app">
  <div class="side-backdrop" id="side-backdrop"></div>
  <aside class="side" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content"><div id="zone"></div></main>
  </div>
</div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/rab-data.js"></script>
<script src="assets/js/rab-core.js"></script>
<script src="assets/js/rab-info.js"></script>
<script src="assets/js/rab-layout.js"></script>
<script>
'use strict';

renderTable('#zone', {
  key:'ahs', perm:'unit-price-analysis', entity:'AHS', idKey:'kode',
  title:'Unit Price Analysis (AHS)', desc:'Analisa harga satuan pekerjaan. Kolom Review menyala ketika harga komponen penyusunnya berubah.',
  rows:()=>DB.AHS,
  toolbar:[TB.add('AHS'), TB.upload('ahs'), TB.download()],
  columns:[
    {key:'kode', label:'Kode Pekerjaan', width:'128px', render:r=>`<span class="cell-main mono">${esc(r.kode)}</span>`},
    {key:'nama', label:'Uraian Pekerjaan', render:r=>`<div class="cell-main">${esc(r.nama)}</div>`},
    {key:'grp',  label:'Kelompok', width:'190px', filter:'select', options:()=>DB.WORKGROUP.map(w=>w.kode),
     render:r=>(DB.WORKGROUP.find(w=>w.kode===r.grp)||{}).nama||r.grp},
    {key:'sat',  label:'Satuan', width:'92px', filter:'select', options:['Unit','M2','M1']},
    {key:'hsp',  label:'Harga Satuan Pekerjaan', width:'180px', align:'right', filter:false, render:r=>money(r.hsp)},
    {key:'status',label:'Status', width:'180px', filter:'select', options:['Draft','Menunggu Verifikasi','Disetujui'],
     render:r=>statusBadge(r.status)+((r.aktif && r.aktif!=='Aktif')?' <span class="bdg off">Non Aktif</span>':'')},
    {key:'review',label:'Tinjau Ulang', width:'130px', align:'center', filter:false, sortValue:r=>r.review?1:0,
     render:r=>r.review?`<span class="bdg warn">Perlu ditinjau</span>`:'<span class="text-ink3">—</span>'}
  ],
  /* rev-6 poin 15 (P-51): ikon Edit (pensil) yang sama dengan menu Material
     ditambahkan di sini. Sebelumnya menu ini hanya punya ikon buka-halaman,
     sehingga mengubah keterangan kepala data (nama, satuan, status, dan
     sejenisnya) harus lewat halaman detail. Kini keduanya tersedia:
     pensil untuk kepala data lewat jendela, ikon buka-halaman untuk isinya. */
  actions:[{k:'open'},'view','edit','copy','delete'],
  onAction:(k,r)=>{
    if (k==='open'){ location.href='unit-price-analysis-detail.html?kode='+r.kode; return true; }
    if (k==='copy'){
      const nk = prompt('Kode AHS baru (duplikasi dari '+r.kode+'):', r.kode+'.C');
      if (nk){ DB.AHS.unshift({...r, kode:nk, status:'Draft', review:false}); DB.AHS_D[nk] = JSON.parse(JSON.stringify(DB.AHS_D[r.kode]||DB.AHS_D['WD.2'])); saveDB(); location.reload(); }
      return true;
    }
    return false;
  },
  /* rev-6 poin 5: klik pada baris tabel TIDAK lagi membuka halaman detail.
     Perpindahan ke detail hanya melalui tombol aksi Buka Halaman Detail,
     agar baris tetap dapat dipilih, disalin, dan disaring tanpa berpindah halaman. */
  /* rev-6 poin 15 (P-51): Margin disimpan sebagai pecahan (0,15) tetapi diisi
     dalam persen (15). Tanpa penyesuaian saat form dibuka, setiap kali Edit
     disimpan nilainya menyusut seratus kali lipat — masalah yang sama dengan
     kolom Waste pada menu Material. */
  /* rev-6 poin 17 (P-53): kolom Status pada form Add/Edit tidak lagi dropdown.
     Kendalanya: status di sini bukan Aktif/Non Aktif melainkan status ALUR yang
     punya lebih dari dua keadaan, sehingga tidak muat pada switch. Pemecahannya
     dipisah menjadi dua hal yang memang berbeda:
       - Status (switch Aktif / Non Aktif), sama persis dengan menu Brand —
         menentukan data ini masih dipakai atau tidak.
       - Status Alur, ditampilkan sebagai badge yang TIDAK dapat diketik.
         Nilainya hanya berubah lewat tombol Submit, Approve, dan Reject pada
         halaman detail (lihat P-52), jadi memang tidak boleh dipilih tangan. */
  form:(d, isNew)=>{
    if (!isNew && d.margin != null && d.margin !== '' && Number(d.margin) <= 1)
      d.margin = Math.round(Number(d.margin) * 10000) / 100;
    return [
    {key:'kode', label:'Kode Pekerjaan', required:true},
    {key:'sat',  label:'Satuan', type:'select', required:true, options:['Unit','M2','M1']},
    {key:'nama', label:'Uraian Pekerjaan', required:true, full:true},
    {key:'grp',  label:'Kelompok Pekerjaan', type:'select', required:true, options:()=>DB.WORKGROUP.map(w=>({v:w.kode,l:w.nama}))},
    {key:'bd',   label:'Breakdown Rujukan', type:'select', options:()=>[''].concat(DB.BREAKDOWN.map(b=>b.kode))},
    {key:'margin',label:'Margin (%)', type:'number', disabled: !can('unit-price-analysis','approve'),
     help: can('unit-price-analysis','approve') ? 'Role SPV ke atas dapat mengubah margin.' : 'Margin terkunci untuk role '+curRole()+'.'},
    {key:'status',label:'Status Alur', type:'static', cls:'stat-lock',
     help:'Berubah melalui tombol Submit, Approve, dan Reject pada halaman detail AHS.'},
    {key:'aktif', label:'Status', type:'switch', def:'Aktif',
     help:'Non Aktif membuat AHS ini tidak dapat dipilih pada BOQ baru.'}
  ];},
  formDefaults:()=>({status:'Draft', aktif:'Aktif', sat:'Unit', margin:15, hsp:0, review:false}),
  beforeSave:o=>{ o.margin = Number(o.margin)/100 || 0.15; },
  /* rev-6 poin 8: jendela Detail memakai keterangan yang sama dengan
     Unit Price List, agar estimator melihat susunan harga yang identik
     dari menu mana pun ia membukanya. */
  detailSub:r=>r.kode+' — '+r.nama+' · per 1 '+r.sat,
  detailSize:'xl',
  detail:r=>ahsDetailHTML(r),
  detailFooter:r=>[
    {label:'Buka Rincian AHS', cls:'btn-primary', ic:'openpage',
     onClick:()=>location.href='unit-price-analysis-detail.html?kode='+r.kode}
  ]
});

</script>
</body>
</html>
